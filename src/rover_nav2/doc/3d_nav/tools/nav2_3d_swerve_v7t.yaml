# v7t: swerve v7 without the TerrainCritic in MPPI (Ackermann runs without it, the costmap layer still carries the terrain). Bag run_v7alane: MPPI dithers at the lane25 ramp foot, vx 0.09 with speed limit 0.37.
# Swerve v7 (experiment, 2026-11-16): v6 plus the heading plan. Merged after nav2_3d_swerve_v6.yaml
# is not possible (one overlay), so v6 is copied below and these are added:
#  - BT navigate_to_pose_3d_heading.xml: each new path goes through the HeadingSmoother.
#  - HeadingSmoother with crabbing on, on the global terrain map.
#  - PathAlignCritic and the rotation shim follow the path orientations, so the rover holds
#    the planned heading instead of finding one live.
bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: "/home/ram/ROS2_Autonomous_2026_27/src/rover_nav2/behavior_trees/navigate_to_pose_3d_heading.xml"
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother", "heading"]
    heading:
      plugin: "rover_traversability/HeadingSmoother"
      map_topic: /terrain/global_features
      allow_crab: true
      crab_weight: 0.5
      reverse_weight: 1.0
      turn_weight: 0.3
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.3925
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      use_path_orientations: true
      closed_loop: true
      vx_max: 0.5
      vy_max: 0.3
      wz_max: 0.6
      vy_std: 0.08
      wz_std: 0.2
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PreferForwardCritic",
          "TwirlingCritic",
        ]
      PathAlignCritic:
        use_path_orientations: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
velocity_smoother:
  ros__parameters:
    max_velocity: [0.5, 0.3, 0.6]
    min_velocity: [-0.4, -0.3, -0.6]
    max_accel: [0.8, 0.3, 0.5]
    max_decel: [-1.0, -0.3, -0.5]
