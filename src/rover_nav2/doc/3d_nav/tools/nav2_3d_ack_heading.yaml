# Ackermann heading-aware planning (experiment, 2026-11-16): v1.1 (nav2_3d_reapproach.yaml, copied
# here since only one overlay is merged) plus the HeadingAwarePlanner. The BT tries it first and
# falls back to Smac Hybrid-A* (GridBased, unchanged) when it finds no path.
bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: "/home/ram/ROS2_Autonomous_2026_27/src/rover_nav2/behavior_trees/navigate_to_pose_ackermann_3d_heading.xml"
    plugin_lib_names: ["rover_approach_goals_bt_node", "rover_near_goal_too_long_bt_node"]
planner_server:
  ros__parameters:
    planner_plugins: ["GridBased", "Heading"]
    Heading:
      plugin: "rover_traversability/HeadingAwarePlanner"
      map_topic: /terrain/global_features
      map_timeout: 5.0
      yaw_bins: 16
      minimum_turning_radius: 0.8   # same as GridBased (rover_control.yaml min_turn_radius)
      allow_reverse: true
      reverse_penalty: 2.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      allow_unknown: true
      tolerance: 0.5
      max_planning_time: 2.0
