# Swerve v6 (experiment, 2026-11-15). v5 with TwirlingCritic back at 10: at 3 the rover yawed while
# driving and rolled to -13.4 deg (safety cancel on urc_mix mid_20m, 2 of 2). Below, the v5 notes.
# Swerve v5 (experiment, 2026-11-14), merged last over the v4 swerve settings. In sim time the v4
# rover reaches the goal area of urc_mix mid_20m at about 60 s, but it flips its body about 150 deg
# 10 m in and drives backwards, then spends 50 to 320 s orbiting the goal to turn back to the goal
# heading: TwirlingCritic penalises the yaw rate it needs, and nothing prefers forward travel.
#  - RotationShimController wraps MPPI: turn in place to the path heading at the start and to the
#    goal heading at the end, which a swerve rover can do and a car cannot.
#  - PreferForwardCritic (weight 5, as in the 2D tuning) against the mid-route flip.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.3925
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      closed_loop: true
      vx_max: 0.5
      vy_max: 0.3
      wz_max: 0.6
      vy_std: 0.08
      wz_std: 0.2
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PreferForwardCritic",
          "TerrainCritic",
          "TwirlingCritic",
        ]
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
velocity_smoother:
  ros__parameters:
    max_velocity: [0.5, 0.3, 0.6]
    min_velocity: [-0.4, -0.3, -0.6]
    max_accel: [0.8, 0.3, 0.5]
    max_decel: [-1.0, -0.3, -0.5]
