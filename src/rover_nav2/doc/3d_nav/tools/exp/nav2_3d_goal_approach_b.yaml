# Final-approach candidate B (2026-11-07): candidate A (heading cost from 1.4 m, weight 10) plus free
# reversing near the goal. PreferForwardCritic acts only beyond threshold_to_consider, so 1.5 m lets
# MPPI back up and re-enter for an Ackermann three-point heading fix inside that radius.
controller_server:
  ros__parameters:
    FollowPath:
      GoalAngleCritic:
        cost_weight: 10.0
        threshold_to_consider: 1.4
      PreferForwardCritic:
        threshold_to_consider: 1.5
