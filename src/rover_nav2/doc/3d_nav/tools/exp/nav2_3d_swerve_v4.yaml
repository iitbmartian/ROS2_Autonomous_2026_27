# Swerve v4 experiment, merged after nav2_params_sim_3d_swerve.yaml (nav_extra_overlay). v2 plus a
# smoother travel direction. Bag swerve_roll_a_1109_0705: near the goal MPPI Omni sent vx 0.40, vy 0.01,
# then vx 0.14, vy 0.17 within 0.5 s, so atan2(vy, vx) swung 1 to 50 deg and the kinematics node
# (2 rad/s wheel turn rate) re-aimed all four wheels each time. Each re-aim pumped the front rockers
# 8 to 12 deg on flat ground. Lateral and yaw acceleration are cut so the direction moves slowly,
# and lateral sampling noise halved. v2 notes follow.
#
# v1 (2026-11-07) spun in place at up to 1 rad/s with wz sign flips, then the body rolled to
# 13 deg on flat ground and the tip guard aborted, so yaw rate is capped and penalised.
# v1 also ran x at 0.25 m/s in the velocity smoother, half of Ackermann, so x matches 0.5.
controller_server:
  ros__parameters:
    FollowPath:
      vx_max: 0.5
      vy_max: 0.3
      wz_max: 0.6
      vy_std: 0.08
      wz_std: 0.2
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "TerrainCritic",
          "TwirlingCritic",
        ]
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.5, 0.3, 0.6]
    min_velocity: [-0.4, -0.3, -0.6]
    max_accel: [0.8, 0.3, 0.5]
    max_decel: [-1.0, -0.3, -0.5]
