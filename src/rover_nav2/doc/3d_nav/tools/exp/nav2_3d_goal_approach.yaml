# Final-approach candidate (2026-11-07): the stock goal heading critic acts only inside 0.5 m,
# too late for an Ackermann turn radius, so far_south ends 15 deg off heading and times out.
# Start the heading cost where the path critics stop (1.4 m) and weigh it like PathFollow.
# Merged last over the 3D overlay via nav_extra_overlay.
controller_server:
  ros__parameters:
    FollowPath:
      GoalAngleCritic:
        cost_weight: 10.0
        threshold_to_consider: 1.4
