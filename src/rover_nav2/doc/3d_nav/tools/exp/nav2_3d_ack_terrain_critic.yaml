# Phase 4b experiment: TerrainCritic on the Ackermann 3D controller, merged last (nav_extra_overlay).
# The costmap keeps one cost per cell, the best heading's, so MPPI took slopes lane25's 25 deg ramp
# about 30 deg off the fall line and rolled to the 13.2 deg abort, three runs of three on the plugin
# suspension (2026-11-09_3d_gt_gate_clean). The critic scores rollouts at their own heading.
# uphill and redirect terms off: they are swerve terms, uphill favours diagonals.
controller_server:
  ros__parameters:
    FollowPath:
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic",
          "TerrainCritic",
        ]
      TerrainCritic:
        enabled: true
        map_topic: /terrain/local_features
        cost_weight: 20.0
        collision_cost: 1000000.0
        unknown_cost: 1.0
        redirect_weight: 0.0
        uphill_weight: 0.0
        trajectory_point_step: 3
        risk_kappa: 1.0
