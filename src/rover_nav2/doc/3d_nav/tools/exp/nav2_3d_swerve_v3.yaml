# Swerve v3 experiment, the fallback if v2 still tips: yaw rate halved again, twirling penalty doubled, x 0.4.
# v1 (2026-11-07) spun in place at up to 1 rad/s with wz sign flips, then the body rolled to
# 13 deg on flat ground and the tip guard aborted, so yaw rate is capped and penalised.
# v1 also ran x at 0.25 m/s in the velocity smoother, half of Ackermann, so x matches 0.5.
controller_server:
  ros__parameters:
    FollowPath:
      vx_max: 0.4
      vy_max: 0.3
      wz_max: 0.4
      vy_std: 0.15
      wz_std: 0.2
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "TerrainCritic",
          "TwirlingCritic",
        ]
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.4, 0.3, 0.4]
    min_velocity: [-0.4, -0.3, -0.4]
    max_accel: [0.7, 0.7, 0.7]
    max_decel: [-0.7, -0.7, -0.7]
