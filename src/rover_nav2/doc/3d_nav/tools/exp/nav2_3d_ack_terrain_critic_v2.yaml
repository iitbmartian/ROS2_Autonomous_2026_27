# Phase 4b experiment v2: TerrainCritic on the Ackermann 3D controller, merged last (nav_extra_overlay).
# v1 (plain 20 u^2) made every slope cost more than standing still: lane25 0/3, sidehill 0/2, lane15 6x
# slower (2026-11-09_3d_gt_ack_critic). v2 costs only u above 0.5 and treats u_tip above 0.80 as a
# collision, where the safety monitor would abort (u_tip about 0.82). Needs the u_free and
# u_tip_lethal critic parameters (install_dev until merged into install).
# The costmap keeps one cost per cell, the best heading's, so MPPI took slopes lane25's 25 deg ramp
# about 30 deg off the fall line and rolled to the 13.2 deg abort, three runs of three on the plugin
# suspension (2026-11-09_3d_gt_gate_clean). The critic scores rollouts at their own heading.
# uphill and redirect terms off: they are swerve terms, uphill favours diagonals.
controller_server:
  ros__parameters:
    FollowPath:
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic",
          "TerrainCritic",
        ]
      TerrainCritic:
        u_free: 0.5
        u_tip_lethal: 0.80
        enabled: true
        map_topic: /terrain/local_features
        cost_weight: 20.0
        collision_cost: 1000000.0
        unknown_cost: 1.0
        redirect_weight: 0.0
        uphill_weight: 0.0
        trajectory_point_step: 3
        risk_kappa: 1.0
