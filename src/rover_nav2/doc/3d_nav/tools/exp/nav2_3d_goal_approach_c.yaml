# Final-approach candidate C. The far_south bag (2026-11-07 21:38) shows the rover 0.31 m sideways
# of the goal, sawing straight back and forth for 13 min while Smac offers a 1.5 m two-cusp path.
# Inside 1.4 m the path critics are off, so only GoalCritic and GoalAngleCritic act and neither
# rewards the sideways shuffle. C keeps the path critics on to 0.3 m and lets it reverse freely.
controller_server:
  ros__parameters:
    FollowPath:
      PathFollowCritic:
        threshold_to_consider: 0.3
      PathAlignCritic:
        threshold_to_consider: 0.3
      GoalCritic:
        threshold_to_consider: 0.3
      PreferForwardCritic:
        threshold_to_consider: 1.5
