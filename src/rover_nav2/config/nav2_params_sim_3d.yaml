# Nav2 parameters, simulation, 3D terrain stack: an OVERLAY on nav2_params_sim.yaml.
#
# This file holds only what differs from the 2D sim tuning. rover_bringup's 3D launch files
# deep-merge it over nav2_params_sim.yaml (rover_nav2.params_overlay): mappings merge key by key,
# lists and scalars here replace the base value. Keeping it an overlay means the 3D stack follows
# every 2D tuning change and differs only where it has to. nav2_params_sim.yaml itself is not
# changed and the 2D stack never reads this file.
#
#   ros2 launch rover_bringup pipeline_3d.launch.py world:=marsyard.sdf
#
# Both costmaps use the TraversabilityLayer (rover_traversability) with the utilisation cost
# model of SPEC.md, fed by terrain_features_node: /terrain/local_features for the local costmap,
# /terrain/global_features for the global one. Controller and planner stay the 2D sim's
# Ackermann MPPI and Smac hybrid until the swerve mode lands (Phase 4).

local_costmap:
  local_costmap:
    ros__parameters:
      # The terrain layer replaces the voxel layer: the voxel layer marks anything 0.15 m above
      # base_footprint as an obstacle, ramps included, which is what stops the 2D stack on slopes.
      plugins: ["traversability_layer", "inflation_layer"]
      traversability_layer:
        plugin: "rover_traversability/TraversabilityLayer"
        enabled: true
        cost_model: utilisation          # SPEC.md cell cost from terrain_features_node
        map_topic: /terrain/local_features
        # The layer reports not current, and the controller stops, once the newest feature map
        # is older than this.
        map_timeout: 1.0
        unknown_cost: 200       # never 255, updateWithMax would drop it
        max_soft_cost: 252
        lethal_dilation_radius: 0.0   # follow the footprint's inscribed radius
        combination_method: 1   # max
        odom_topic: /odom
        braking_decel: 0.5      # m/s^2, conservative for loose ground
        braking_margin: 0.25    # m beyond the stopping distance

global_costmap:
  global_costmap:
    ros__parameters:
      # The same layer on the coarse global terrain map replaces RTAB-Map's 2D grid, which also
      # marks ramps as walls. Fixed 100 m square in map, like terrain_mapping_node's global map.
      plugins: ["traversability_layer", "inflation_layer"]
      rolling_window: false
      width: 100
      height: 100
      origin_x: -50.0
      origin_y: -50.0
      resolution: 0.2
      track_unknown_space: true
      traversability_layer:
        plugin: "rover_traversability/TraversabilityLayer"
        enabled: true
        cost_model: utilisation
        map_topic: /terrain/global_features
        map_timeout: 5.0        # the global map publishes at 1 Hz
        unknown_cost: 200
        max_soft_cost: 252
        lethal_dilation_radius: 0.0
        combination_method: 1
        odom_topic: /odom
        braking_decel: 0.5
        braking_margin: 0.25
