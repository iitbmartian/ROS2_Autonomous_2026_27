# Nav2 parameters, simulation, 3D terrain stack with the swerve drive: an OVERLAY applied on top
# of nav2_params_sim_3d.yaml (itself an overlay on nav2_params_sim.yaml).
#
#   ros2 launch rover_bringup pipeline_3d.launch.py drive:=swerve
#
# Phase 4 (SPEC.md drive and controller cost): rover_kinematics_node runs its swerve mode, MPPI
# uses the Omni motion model and scores rollouts on the terrain at their actual heading
# (TerrainCritic), Smac plans in 2D since there is no turning radius any more. Critics that force
# the heading along the path are off: the point of swerve is crossing a slope facing uphill.

controller_server:
  ros__parameters:
    FollowPath:
      motion_model: "Omni"
      vy_max: 0.2
      vy_std: 0.1
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "TerrainCritic",
        ]
      PathAngleCritic:
        enabled: false        # forces heading along the path, see header
      PreferForwardCritic:
        enabled: false        # crabbing and reversing are fine with swerve
      TerrainCritic:
        enabled: true
        map_topic: /terrain/local_features
        cost_weight: 20.0     # times u^2 per evaluated point
        collision_cost: 1000000.0
        unknown_cost: 1.0
        redirect_weight: 2.0  # per radian of travel-direction change: wheels must re-aim
        uphill_weight: 5.0    # time penalty per unit slope along travel
        trajectory_point_step: 3
        risk_kappa: 1.0

planner_server:
  ros__parameters:
    GridBased:
      # No minimum turning radius with swerve, so the hybrid planner's arcs are wrong here.
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      allow_unknown: true
      downsample_costmap: false
      max_iterations: 1000000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0

velocity_smoother:
  ros__parameters:
    # [x, y, theta]
    max_velocity: [0.25, 0.2, 1.2]
    min_velocity: [-0.2, -0.2, -1.2]
    max_accel: [2.0, 2.0, 2.0]
    max_decel: [-2.0, -2.0, -2.0]
