# terrain_mapping_node in simulation. ROS parameters for the node. FastDEM's pipeline lives in
# fastdem_sim.yaml next to this file, in FastDEM's own format.
terrain_mapping:
  ros__parameters:
    use_sim_time: true
    fastdem_config: ""          # set by terrain_mapping.launch.py to fastdem_sim.yaml
    base_frame: base_footprint
    map_frame: odom
    map_length: 10.0            # m, square, matches the 10 m local costmap
    resolution: 0.05            # m, matches the local costmap
    publish_rate: 5.0           # Hz, matches the local costmap update rate
    tf_timeout: 0.1             # s, wait for odom -> base_footprint at the scan stamp
    publish_features: false     # true publishes FastDEM's features, the Phase 0 bridge

    # Each input has its own sensor model and range limits (SPEC.md, rover_terrain_mapping).
    inputs: ["lidar", "depth"]
    lidar:
      topic: /lidar/points
      sensor_model: lidar       # near-constant range noise
      range_min: 1.0            # m. The body box below does the real self filtering.
      range_max: 12.0           # m, beyond the 5 m half-width of the map
    depth:
      topic: /terrain/depth_points   # depth_range_cut output (Orin stand-in in sim)
      sensor_model: rgbd        # noise growing with range squared
      range_min: 0.3
      range_max: 4.0            # depth_range_cut already crops here

    # The sim EKF runs in 3D (ekf_rover_gazebo_imu.yaml), so TF carries roll and pitch.
    # The real rover's EKF is planar: use imu there.
    gravity_source: tf
    imu_topic: /imu/data

    # Body box from rover_physical.yaml footprint, padded, ground to this height.
    self_filter:
      enabled: true
      padding: 0.10
      height: 1.0

    # Coarse map fixed in RTAB-Map's map frame, for the global costmap (Phase 6 handles loop
    # closures).
    global:
      enabled: true
      frame: map
      length: 100.0
      resolution: 0.2
      publish_rate: 1.0
