# ros2_control setup for suspension:=mimic (rover.urdf.xacro), Bullet-Featherstone
# only. Identical to controllers.yaml except rocker_coupling_controller: BLS/BRS/FRS
# are held by <mimic> tags now (rover_body.xacro), not commanded, so only FLS_joint,
# the suspension's one genuinely free coordinate, needs a controller here -- see
# rover_ros2_control.xacro and rocker_hold_node.py. Loaded by the gz_ros2_control
# system plugin, which runs the controller manager inside the simulator so commands
# land at the physics rate.

controller_manager:
  ros__parameters:
    update_rate: 1000         # Hz, matched to the physics step
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    steer_controller:
      type: position_controllers/JointGroupPositionController

    wheel_controller:
      type: velocity_controllers/JointGroupVelocityController

    # Only FLS_joint -- see the file header.
    rocker_coupling_controller:
      type: effort_controllers/JointGroupEffortController

    # Explicit-PID mode's (teleop key 5) effort-controlled counterparts to
    # steer_controller/wheel_controller above, driven by control_node.py's own
    # per-joint PID instead of this controller's own ideal setpoint tracking.
    # Spawned --inactive (see launch/rover_sim.launch.py) and only activated, with
    # steer_controller/wheel_controller deactivated in the same call, while
    # explicit_pid mode is selected -- rover_kinematics_node makes that switch, so
    # exactly one of the two pairs is ever active on a given joint.
    steer_pid_controller:
      type: effort_controllers/JointGroupEffortController

    wheel_pid_controller:
      type: effort_controllers/JointGroupEffortController

steer_controller:
  ros__parameters:
    joints: [FLE_joint, FRE_joint, BLE_joint, BRE_joint]
    interface_name: position

wheel_controller:
  ros__parameters:
    joints: [FLD_joint, FRD_joint, BLD_joint, BRD_joint]
    interface_name: velocity

rocker_coupling_controller:
  ros__parameters:
    joints: [FLS_joint]
    interface_name: effort

# Same joint order as steer_controller/wheel_controller above -- control_node.py's
# command arrays are index-aligned with these lists.
steer_pid_controller:
  ros__parameters:
    joints: [FLE_joint, FRE_joint, BLE_joint, BRE_joint]
    interface_name: effort

wheel_pid_controller:
  ros__parameters:
    joints: [FLD_joint, FRD_joint, BLD_joint, BRD_joint]
    interface_name: effort
