# Driving limits and feel. These are the knobs worth touching; everything geometric
# lives in rover_kinematics.yaml and is generated from the CAD.

rover_kinematics:
  ros__parameters:
    use_sim_time: true
    max_speed: 1.0             # m/s
    min_turn_radius: 0.8       # m, tightest Ackermann arc measured from the rover centre
    max_steer_angle: 1.5708    # rad, leave at a quarter turn so spot mode can reach it
    max_yaw_rate: 1.0          # rad/s, ackermann/crab yaw-rate range. Calibrates
                               # steer_ramp_time for those modes; mirrors teleop_rover's
                               # own max_yaw_rate below so the ramp time it documents
                               # (lock to lock) is actually the range being ramped
    max_spin_rate: 0.7854      # rad/s, 45 deg/s in spot mode
    max_wheel_turn_rate: 2.0   # rad/s, ~115 deg/s. Caps how fast the solved wheel angle
                               # may change in ackermann/crab/spot, so a command that
                               # flips direction sweeps the wheels there instead of
                               # snapping, which is what was kicking the chassis around
                               # on a crab reversal
    explicit_max_steer_angle: 1.5708  # rad, explicit mode's own clamp on the aim. Its
                               # own knob so the aim can be opened up without loosening
                               # what the other three modes may ask for. The joints stop
                               # hard at 1.75, so leave margin or they chatter there
    explicit_max_steer_rate: 1.0      # rad/s ceiling on an incoming sweep rate. Well
                               # above the teleop's 0.2618, so it only catches a runaway
    speed_ramp_time: 1.2       # s, standstill to full speed
    steer_ramp_time: 0.8       # s, lock to lock
    update_rate: 100.0         # Hz
    command_timeout: 0.5       # s since a cmd_vel's header.stamp before the rover coasts
                               # to a stop -- measured from the message's own stamp, not
                               # when it arrived, via a wall-clock Clock dedicated to this
                               # one comparison (this node otherwise runs use_sim_time)
    mode: ackermann

# Keyboard feel. Read only when the sim is launched with teleop:=true; running
# teleop_rover.py by hand uses the defaults declared in the script instead.
teleop_rover:
  ros__parameters:
    # False on purpose, unlike the other two blocks in this file. Teleop times raw
    # keypresses (hold_time expiry, boost) against its own clock, and a sim-time clock
    # sits pinned at exactly zero until /clock arrives and afterward can only run at
    # or below wall-clock speed, so hold_time would stretch or, if /clock is ever
    # absent, never expire at all -- a key once boosted would stay boosted.
    use_sim_time: false
    max_speed: 1.0             # m/s
    max_yaw_rate: 1.0          # rad/s, what A/D ask for in Ackermann
    max_spin_rate: 0.7854      # rad/s, what A/D ask for in spot
    max_steer_rate: 0.2618     # rad/s, ~15 deg/s. What A/D sweep at in explicit mode,
                               # and the rate C sweeps back to straight at. Slow on
                               # purpose: aiming is meant to be deliberate, and Shift
                               # does not boost it
    boost: 2.5                 # Shift multiplier, drive speed only
    hold_time: 0.4             # s a key stays live after its last repeat
    update_rate: 50.0          # Hz

# The Tkinter window (teleop_gui:=true). A separate block because its node name is
# "teleop_rover_gui", not "teleop_rover" -- a ROS params file only applies to a node
# whose name matches its block, so without this the window would silently run on
# nothing but its script defaults (they happen to match the block above, but future
# edits here wouldn't reach it). use_sim_time is left at the rclpy default (false):
# unlike teleop_rover this frontend has no hold_time-style guess to age out against the
# wrong clock, since it reads real key press/release events, not repeat timing.
teleop_rover_gui:
  ros__parameters:
    max_speed: 1.0             # m/s
    max_yaw_rate: 1.0          # rad/s, what A/D ask for in Ackermann
    max_spin_rate: 0.7854      # rad/s, what A/D ask for in spot
    max_steer_rate: 0.2618     # rad/s, ~15 deg/s, explicit mode A/D
    boost: 2.5                 # Shift multiplier, drive speed only
    update_rate: 50.0          # Hz
    key_release_debounce_ms: 250  # ms a KeyRelease is held pending before it's treated
                               # as real, so a same-key autorepeat KeyPress arriving
                               # within that window cancels it instead of the key
                               # falsely reading as let go. Needs to comfortably exceed
                               # both the OS's key-repeat interval (~33-40 ms typically)
                               # and whatever scheduling delay the machine itself adds
                               # under load, since Tk's after() timers and the real key
                               # events race against the same pressure -- 150 ms was not
                               # enough on a loaded machine. If a held key still drops
                               # occasionally, raise this further; if release feels
                               # laggy on a machine that never has the problem, it can
                               # come back down.

explicit_pid_control:
  ros__parameters:
    use_sim_time: true
    mode: ackermann            # starting mode; keep equal to rover_kinematics's mode
    # Retuned 2026-10-12 from headless Gazebo runs (doc/VERIFICATION.md, "Explicit_PID
    # stability"). The earlier values (steer kp=1/kd=3, wheel kp=0.4/ki=0.4, plus sync
    # and chassis-yaw terms) were tuned while rocker_coupling was in a sustained
    # oscillation, which dithered the joints and hid two real problems: steer kp=1
    # commands 0.5 N m at 30 deg of error, which is below the knuckle's own 0.5 N m
    # joint friction plus tyre scrub, so on a calm rover the steering never moved at
    # all; and the wheel PI settled ~19% fast and rang for seconds after a stop. The
    # chassis "spin" those extra terms were added for was the steering failing to hold
    # its angle, not a separate loop -- with these gains yaw drift is <2 deg per run
    # with chassis_yaw_kd and both sync terms at 0, so they ship disabled.
    steer_kp: 60.0               # N m / rad. Must beat 0.5 N m friction + scrub with
                                  # well under a degree of error
    steer_ki: 20.0               # N m / (rad s); removes the last ~0.5-1 deg the
                                  # friction would otherwise leave
    steer_kd: 2.0                # N m / (rad/s), derivative on measured joint velocity
    steer_max_effort: 60.0       # N m, well inside the xacro's 150 N m backstop
    steer_max_effort_rate: 100000.0  # N m/s, effectively off. A slew limit inside the
                                  # loop is pure phase lag; nothing measured needs it
                                  # once the suspension is not oscillating
    steer_sync_kp: 0.0           # N m / rad toward the other 3 joints' mean. Measured
                                  # no benefit; kept as a knob, 0 disables
    chassis_yaw_kd: 0.0          # N m / (rad/s) of /odom yaw rate on all 4 knuckles.
                                  # +15/0/-15 measured within noise of each other once
                                  # steering holds; 0 disables
    chassis_yaw_ki: 0.0          # N m / rad of accumulated /odom yaw rate; same
                                  # story as chassis_yaw_kd, 0 disables
    wheel_kp: 5.0                 # N m / (rad/s). 0.4 ran 19% fast; 10+ tracked but
                                  # made the 4 wheels fight each other through the
                                  # ground (opposing +-14 N m) and doubled yaw drift
    wheel_ki: 10.0                # N m / rad. Was 2: on a 20-25 deg slope that ran
                                  # 21% slow climbing and 1.6x fast descending. Swept
                                  # 2/5/10 (doc/STRESS_TESTING.md, F4); 10 is the lowest
                                  # within 10% climbing and 1.3x descending
    wheel_kd: 0.0                 # N m / (rad/s^2); off, differentiates a noisy velocity
    wheel_max_effort: 60.0       # N m
    wheel_hold_max_effort: 25.0  # N m. At a zero target the integrator keeps running
                                  # as a brake (holds on a slope; ~11 N m needed at 25
                                  # deg) but its term is capped here, so front and rear
                                  # cannot wind up into a squeeze at a standstill
    wheel_sync_kp: 0.0            # N m / (rad/s) toward the other 3 wheels' mean;
                                   # measured no benefit, 0 disables
    wheel_max_effort_rate: 1000.0  # N m/s
    update_rate: 200.0           # Hz

rocker_coupling:
  ros__parameters:
    use_sim_time: true
    stiffness: 8000.0          # N m per rad of constraint residual
    damping: 50.0              # N m per rad/s. Was 250: with the steer/drive joints
                               # torque-driven (explicit_pid) 250 broke into a
                               # self-sustaining ~2-3 g pitch shake within seconds,
                               # and 800 was worse -- this loop closes over a ROS
                               # topic, so its D term acts on stale data. 50 was
                               # calm in every mode; see doc/VERIFICATION.md
    max_torque: 400.0          # N m per joint. Enough to hold the suspension, and
                               # deliberately no more: whatever residual the coupling
                               # cannot correct becomes a fore-aft shove that a
                               # sideways-pointing wheel cannot resist, so a bigger
                               # ceiling makes crab and spot drift
    update_rate: 500.0         # Hz
    capture_rest: true         # zero the coupling against the settled pose,
                               # not the CAD pose, so it applies no standing
                               # push once the rover has bedded in
    rest_capture_delay: 2.5    # s of settling before that reference is taken
    rest_capture_max: 0.01745  # rad (1 deg). A captured residual bigger than this
                               # means the rover was not level at capture time, so the
                               # CAD rest (zero) is held instead of a twisted pose
    max_torque_rate: 1000000.0 # N m/s ceiling on how fast the torque may change,
                               # separate from how large it may get. Effectively
                               # unlimited here. Tuning it down measurably cuts the
                               # Gazebo Harmonic jitter, but costs real residual
                               # (settled error roughly 3x to 8x worse in testing,
                               # not free) -- see doc/VERIFICATION.md before touching
    velocity_filter_tau: 0.0   # s, one-pole low-pass time constant on the D term's
                               # velocity. 0 disables it. Tested at 0.02 s alone and
                               # made both the jitter and the residual worse, not
                               # better -- leave at 0 unless re-measured yourself,
                               # see doc/VERIFICATION.md

# suspension:=mimic only (Bullet-Featherstone) -- rocker_hold_node.py, holding only
# FLS_joint now that BLS/BRS/FRS are held by <mimic> tags instead. Gains are carried
# over from rocker_coupling's own four-joint tuning above as a starting point only:
# live-measured to hold FLS bounded rather than drifting to its hard stop, but with
# real jitter (roughly +/-5 deg around the captured rest pose) that this single-joint
# case has not yet been retuned for. See doc/VERIFICATION.md.
rocker_hold:
  ros__parameters:
    use_sim_time: true
    stiffness: 8000.0          # N m per rad of residual
    damping: 1000.0            # N m per rad/s
    max_torque: 8000.0         # N m. Raised again from an earlier fix's 2000: at
                               # 2000, idle on a fresh launch could still saturate
                               # solid and chatter -- measured live, FLS oscillating
                               # 13 to 24 deg, commands pinned at -2000 repeatedly,
                               # not converging. 8000 removes that saturating
                               # chatter (converges to a stable point instead), but
                               # does NOT fix the deeper problem -- see
                               # rocker_hold_node.py's module docstring: under real
                               # driving loads (a spot turn, measured), FLS/FRS still
                               # reach their hard limits regardless of this value,
                               # because <mimic>'s rigid constraint enforcement
                               # itself, not insufficient torque, is what's forcing
                               # the large excursion. Known unresolved limitation.
    update_rate: 400.0         # Hz
    capture_rest: true         # same rationale as rocker_coupling's own: hold
                               # against wherever FLS actually settles, not a
                               # CAD-nominal pose it may never rest at
    rest_capture_delay: 2.5    # s of settling before that reference is taken
    max_torque_rate: 1000000.0 # N m/s, effectively unlimited; not yet re-measured
                               # for this single-joint case the way rocker_coupling's
                               # own value above was
    velocity_filter_tau: 0.0   # s, 0 disables the one-pole low-pass on the D term's
                               # velocity; not yet re-measured for this single-joint
                               # case either
    pre_capture_hold: true     # apply the same stiffness+damping PD as the
                               # post-capture hold, targeting 0.0, while waiting out
                               # rest_capture_delay, instead of leaving FLS_joint
                               # fully free. Needed here and not on
                               # rocker_coupling_node's own four independent rockers:
                               # this joint reflects all four rockers' inertia through
                               # the mimic constraint from the first physics step, and
                               # measured live, it never actually settles left free or
                               # damping-only -- it crawls steadily (confirmed for a
                               # full 40 s) toward its hard limit instead. Safe to
                               # anchor at 0.0 because suspension:=torque's own
                               # measured rest position on this rover is -0.0007 deg.
                               # See rocker_hold_node.py.
