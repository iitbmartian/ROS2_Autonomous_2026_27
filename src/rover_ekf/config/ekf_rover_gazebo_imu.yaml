### ekf_rover_gazebo_imu.yaml ###
# Loaded on top of ekf_rover_gazebo.yaml when ekf_rover_gazebo.launch.py runs with
# use_imu:=true. Adds the gyro yaw rate from covariance_relay's /imu_relay (the
# rover_gazebo /imu/data stream with covariances filled in) next to the
# wheel-derived yaw rate.
ekf_filter_node:
  ros__parameters:
    imu0: /imu_relay
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 10
