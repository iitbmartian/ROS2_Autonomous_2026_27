### ekf_rover_gazebo_imu.yaml ###
# Loaded on top of ekf_rover_gazebo.yaml when ekf_rover_gazebo.launch.py runs with
# use_imu:=true (the pipeline.launch.py default). Fuses covariance_relay's
# /imu_relay (the rover_gazebo /imu/data stream with covariances filled in).
#
# The filter runs in 3D here. In two_d_mode it publishes odom -> base_footprint
# with roll and pitch forced to zero, so whenever the chassis pitched, RTAB-Map
# projected the lidar as if it were level: rings that hit the ground came out
# above Grid/MaxGroundHeight and were painted as obstacles, then cleared again
# when the rover levelled out. That was the flickering walls. Under
# odom_source:=ground_truth the TF carried the real attitude, which is why SLAM
# looked fine on its own.
#
# Roll and pitch come from the IMU's gravity-referenced orientation. Absolute yaw
# is NOT fused: the IMU has no magnetometer here, so heading stays relative and
# comes from the gyro and wheel yaw rates.
ekf_filter_node:
  ros__parameters:
    two_d_mode: false

    imu0: /imu_relay
    imu0_config: [false, false, false,  # x , y , z
                  true,  true,  false,  # roll, pitch ,yaw
                  false, false, false,  # vx, vy, vz 
                  true,  true,  true,   # wroll, wpitch, wyaw
                  true, true, true]  # ax, ay, az 
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
