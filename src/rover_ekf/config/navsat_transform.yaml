### navsat_transform.yaml ###
# Params for navsat_transform_node, converting a raw sensor_msgs/NavSatFix
# into an odometry message (/odometry/gps) in the same frame ekf_filter_node
# already works in, so GPS/GNSS can be fused as another position source.
# See ../launch/gps_fusion.launch.py.
navsat_transform_node:
  ros__parameters:
    frequency: 30.0

    # GPS altitude is not fused (ekf_rover_gazebo_gps.yaml takes x/y only), and with
    # use_imu:=false the EKF runs two_d_mode; keep the GPS-derived odometry flat.
    zero_altitude: true

    # No magnetic declination correction (sim, and unset for real GNSS fields too).
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0

    # Heading comes from the IMU, not integrated odometry.
    use_odometry_yaw: false

    # Establish the local-frame origin from the first GPS+IMU+odom fix seen,
    # rather than a fixed, surveyed datum.
    wait_for_datum: false

    broadcast_utm_transform: false
    publish_filtered_gps: false
