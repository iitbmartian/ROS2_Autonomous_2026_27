# Driving limits and feel. These are the knobs worth touching; everything geometric
# lives in rover_kinematics.yaml and is generated from the CAD.

rover_kinematics:
  ros__parameters:
    use_sim_time: true
    max_speed: 1.0             # m/s
    min_turn_radius: 0.8       # m, tightest Ackermann arc measured from the rover centre
    max_steer_angle: 1.5708    # rad, leave at a quarter turn so spot mode can reach it
    max_spin_rate: 0.7854      # rad/s, 45 deg/s in spot mode
    max_wheel_turn_rate: 2.0   # rad/s, ~115 deg/s. Caps how fast the solved wheel angle
                               # may change in ackermann/crab/spot, so a command that
                               # flips direction sweeps the wheels there instead of
                               # snapping, which is what was kicking the chassis around
                               # on a crab reversal
    explicit_max_steer_angle: 1.5708  # rad, explicit mode's own clamp on the aim. Its
                               # own knob so the aim can be opened up without loosening
                               # what the other three modes may ask for. The joints stop
                               # hard at 1.75, so leave margin or they chatter there
    explicit_max_steer_rate: 1.0      # rad/s ceiling on an incoming sweep rate. Well
                               # above the teleop's 0.2618, so it only catches a runaway
    speed_ramp_time: 1.2       # s, standstill to full speed
    steer_ramp_time: 0.8       # s, lock to lock
    update_rate: 100.0         # Hz
    command_timeout: 0.5       # s without a Twist before the rover coasts to a stop
    mode: ackermann

# Keyboard feel. Read only when the sim is launched with teleop:=true; running
# teleop_rover.py by hand uses the defaults declared in the script instead.
teleop_rover:
  ros__parameters:
    # False on purpose, unlike the other two blocks in this file. Teleop times raw
    # keypresses (hold_time expiry, boost) against its own clock, and a sim-time clock
    # sits pinned at exactly zero until /clock arrives and afterward can only run at
    # or below wall-clock speed, so hold_time would stretch or, if /clock is ever
    # absent, never expire at all -- a key once boosted would stay boosted.
    use_sim_time: false
    max_speed: 1.0             # m/s
    max_yaw_rate: 1.0          # rad/s, what A/D ask for in Ackermann
    max_spin_rate: 0.7854      # rad/s, what A/D ask for in spot
    max_steer_rate: 0.2618     # rad/s, ~15 deg/s. What A/D sweep at in explicit mode,
                               # and the rate C sweeps back to straight at. Slow on
                               # purpose: aiming is meant to be deliberate, and Shift
                               # does not boost it
    boost: 2.5                 # Shift multiplier, drive speed only
    hold_time: 0.4             # s a key stays live after its last repeat
    update_rate: 50.0          # Hz

rocker_coupling:
  ros__parameters:
    use_sim_time: true
    stiffness: 8000.0          # N m per rad of constraint residual
    damping: 250.0             # N m per rad/s
    max_torque: 400.0          # N m per joint. Enough to hold the suspension, and
                               # deliberately no more: whatever residual the coupling
                               # cannot correct becomes a fore-aft shove that a
                               # sideways-pointing wheel cannot resist, so a bigger
                               # ceiling makes crab and spot drift
    update_rate: 500.0         # Hz
    capture_rest: true         # zero the coupling against the settled pose,
                               # not the CAD pose, so it applies no standing
                               # push once the rover has bedded in
    rest_capture_delay: 2.5    # s of settling before that reference is taken
    max_torque_rate: 1000000.0 # N m/s ceiling on how fast the torque may change,
                               # separate from how large it may get. Effectively
                               # unlimited here. Tuning it down measurably cuts the
                               # Gazebo Harmonic jitter, but costs real residual
                               # (settled error roughly 3x to 8x worse in testing,
                               # not free) -- see doc/VERIFICATION.md before touching
    velocity_filter_tau: 0.0   # s, one-pole low-pass time constant on the D term's
                               # velocity. 0 disables it. Tested at 0.02 s alone and
                               # made both the jitter and the residual worse, not
                               # better -- leave at 0 unless re-measured yourself,
                               # see doc/VERIFICATION.md
