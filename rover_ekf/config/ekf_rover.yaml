### ekf_wheels_config.yaml ###
# EKF that fuses ONLY the 4 individual (noise-injected) wheel encoder
# velocities - IMU is intentionally NOT included, for isolated wheel-odometry testing.
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    publish_tf: true
    publish_acceleration: false

    # ---- Front-left wheel ----
    odom0: /wheel_fl/odom_relayed
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # ---- Front-right wheel ----
    odom1: /wheel_fr/odom_relayed
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_queue_size: 10

    # ---- Rear-left wheel ----
    odom2: /wheel_rl/odom_relayed
    odom2_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom2_differential: false
    odom2_queue_size: 10

    # ---- Rear-right wheel ----
    odom3: /wheel_rr/odom_relayed
    odom3_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom3_differential: false
    odom3_queue_size: 10

